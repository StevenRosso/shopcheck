name: ShopCheck CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  maven-tests:
    name: Cucumber tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Cucumber tests
        run: mvn -B test "-Dcucumber.filter.tags=not @ui"

      - name: Keep the Cucumber reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports
          path: target/cucumber-reports/

  docker-tests:
    name: Cucumber tests (Docker image)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Build the test image
        run: docker build -t shopcheck-tests .

      - name: Run the tests in the container
        run: docker run --rm shopcheck-tests
